name: Patch editable maintenance and repairs

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'feature/edit-maintenance-repairs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Patch Cost Rig history editing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path=Path('index.html')
          s=path.read_text()

          def rep(old,new,label):
              global s
              if old not in s:
                  raise SystemExit(f'Missing expected block: {label}')
              s=s.replace(old,new,1)

          rep('<title>Equipment Cost Book V4.9.7</title>','<title>Equipment Cost Book V4.9.8</title>','page version')
          rep('<p class="versionNote">Equipment Cost Book · V4.9.4</p>','<p class="versionNote">Equipment Cost Book · V4.9.8</p>','profile version')
          rep('let currentId=null, editingId=null;','let currentId=null, editingId=null, editingEntry=null;','edit state')
          rep('const entryModal=document.getElementById("entryModal");\nconst entryEquipment=document.getElementById("entryEquipment");','const entryModal=document.getElementById("entryModal");\nconst entryModalTitle=document.getElementById("entryModalTitle");\nconst entryEquipment=document.getElementById("entryEquipment");','entry title ref')

          start=s.index('function openEntry(type,id){')
          end=s.index('function openService(id)',start)
          entry_block=r'''function openEntry(type,id){
 if(!canEdit())return alert("Your role is view-only.");
 if(!assets.length)return openEquipment();
 editingEntry=null;entryModalTitle.textContent="Add Cost";
 entryType.disabled=false;entryEquipment.disabled=false;repairDowntime.disabled=false;
 entryType.value=type||"maintenance";
 entryEquipment.innerHTML=assets.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join("");
 if(id)entryEquipment.value=id;
 entryDate.value=today();entryCost.value="";entryDescription.value="";entryNotes.value="";
 repairStatus.value="open";repairVendor.value="";repairDowntime.value="no";
 repairFields.classList.toggle("hidden",entryType.value!=="repair");
 formMessage("entry","");entryModal.classList.add("open")
}
function splitMaintenanceNotes(value){
 const raw=String(value||""),marker=" — ",at=raw.indexOf(marker);
 return at<0?{description:raw||"Maintenance",notes:""}:{description:raw.slice(0,at)||"Maintenance",notes:raw.slice(at+marker.length)};
}
function editEntryRecord(type,id){
 if(!canEdit())return alert("Your role is view-only.");
 const record=type==="maintenance"?maintenance.find(x=>x.id===id):type==="repair"?repairs.find(x=>x.id===id):null;
 if(!record)return setCloudStatus("That record is no longer available. Refresh and try again.",true);
 editingEntry={type,id};
 entryModalTitle.textContent=type==="maintenance"?"Edit Maintenance":"Edit Repair";
 entryEquipment.innerHTML=assets.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join("");
 entryEquipment.value=record.asset_id;entryEquipment.disabled=true;entryType.disabled=true;repairDowntime.disabled=true;entryType.value=type;
 if(type==="maintenance"){
   const p=splitMaintenanceNotes(record.notes);
   entryDate.value=record.service_date||today();entryCost.value=record.cost??0;entryDescription.value=p.description;entryNotes.value=p.notes;
   repairStatus.value="open";repairVendor.value="";repairDowntime.value="no";
 }else{
   entryDate.value=(record.opened_at||"").slice(0,10)||today();entryCost.value=record.cost??0;entryDescription.value=record.title||"Repair";entryNotes.value=record.description||"";
   repairStatus.value=record.status||"open";repairVendor.value=record.vendor||"";repairDowntime.value="no";
 }
 repairFields.classList.toggle("hidden",type!=="repair");formMessage("entry","");entryModal.classList.add("open")
}
async function saveEntry(){
 if(!canEdit())return alert("Your role is view-only.");
 let aid=entryEquipment.value,type=entryType.value,cost=Number(entryCost.value||0),desc=entryDescription.value.trim()||type,date=entryDate.value||today(),notes=entryNotes.value.trim();
 if(!assets.some(a=>a.id===aid))return formMessage("entry","Choose equipment before saving a cost.",entryEquipment);
 if(!Number.isFinite(cost)||cost<0)return formMessage("entry","Enter a valid cost of 0 or more.",entryCost);
 formMessage("entry","");let recorded=false;
 try{
  if(editingEntry){
   if(editingEntry.type!==type)return formMessage("entry","Entry type cannot be changed while editing.");
   if(type==="maintenance"){
     const existing=maintenance.find(x=>x.id===editingEntry.id);if(!existing)throw new Error("Maintenance record no longer exists.");
     await sb("/rest/v1/maintenance_records?id=eq."+encodeURIComponent(existing.id)+"&workspace_id=eq."+encodeURIComponent(workspace.id),{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({service_date:date,cost,notes:desc+(notes?" — "+notes:"")})});
   }else if(type==="repair"){
     const existing=repairs.find(x=>x.id===editingEntry.id);if(!existing)throw new Error("Repair record no longer exists.");
     const status=repairStatus.value,completed=status==="completed";
     await sb("/rest/v1/repairs?id=eq."+encodeURIComponent(existing.id)+"&workspace_id=eq."+encodeURIComponent(workspace.id),{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({title:desc,description:notes||null,status,opened_at:date+"T12:00:00Z",completed_at:completed?(existing.completed_at||date+"T12:00:00Z"):null,cost,vendor:repairVendor.value.trim()||null,updated_at:new Date().toISOString()})});
   }else throw new Error("Only maintenance and repair records can be edited here.");
   recorded=true;
  }else if(type==="maintenance"){
   await sb("/rest/v1/maintenance_records",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify({workspace_id:workspace.id,asset_id:aid,service_date:date,cost,notes:desc+(notes?" — "+notes:""),created_by:userId()})});recorded=true;
  }else if(type==="repair"){
   let status=repairStatus.value,completed=status==="completed";let body={workspace_id:workspace.id,asset_id:aid,title:desc,description:notes||null,status,opened_at:date+"T12:00:00Z",completed_at:completed?date+"T12:00:00Z":null,cost,vendor:repairVendor.value.trim()||null,created_by:userId()};
   await sb("/rest/v1/repairs",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify(body)});recorded=true;
   if(repairDowntime.value==="yes"&&!completed){let existing=downtime.find(x=>x.asset_id===aid&&!x.ended_at);if(!existing)await sb("/rest/v1/downtime_events",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify({workspace_id:workspace.id,asset_id:aid,started_at:new Date(date+"T12:00:00Z").toISOString(),reason:"Repair: "+desc,notes:notes||null,created_by:userId()})});await sb("/rest/v1/assets?id=eq."+aid,{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({status:"down",updated_at:new Date().toISOString()})})}
  }else{
   await sb("/rest/v1/expenses",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify({workspace_id:workspace.id,asset_id:aid,category:"other",amount:cost,expense_date:date,description:desc+(notes?" — "+notes:""),created_by:userId()})});recorded=true;
  }
  editingEntry=null;entryType.disabled=false;entryEquipment.disabled=false;repairDowntime.disabled=false;closeModal("entryModal");await reloadCloud();openDetail(aid);
 }catch(e){if(recorded){closeModal("entryModal");setCloudStatus("The entry was saved, but cloud refresh did not finish. Refresh before editing it again.",true)}else formMessage("entry","Could not save entry: "+e.message)}
}
'''
          s=s[:start]+entry_block+s[end:]

          old='''function repairCard(r){
 const a=assets.find(x=>x.id===r.asset_id);
 return `<div class="card"><div class="row"><div><div class="kicker">${repairStatusText(r.status)}</div><b>${esc(r.title)}</b><div class="tiny">${a?esc(a.name)+" · ":""}${(r.opened_at||"").slice(0,10)}${r.vendor?" · "+esc(r.vendor):""}</div></div><b>${money(r.cost)}</b></div><div style="height:10px"></div><div class="row"><button class="miniBtn" onclick="openDetail('${r.asset_id}')">View Asset</button>${canEdit()&&r.status!=="completed"?`<button class="btn" onclick="completeRepair('${r.id}')">Complete Repair</button>`:""}</div></div>`
}
'''
          new='''function repairCard(r){
 const a=assets.find(x=>x.id===r.asset_id);
 return `<div class="card"><div class="row"><div><div class="kicker">${repairStatusText(r.status)}</div><b>${esc(r.title)}</b><div class="tiny">${a?esc(a.name)+" · ":""}${(r.opened_at||"").slice(0,10)}${r.vendor?" · "+esc(r.vendor):""}</div></div><b>${money(r.cost)}</b></div><div style="height:10px"></div><div class="row"><button class="miniBtn" onclick="openDetail('${r.asset_id}')">View Asset</button><div style="display:flex;gap:8px">${canEdit()?`<button class="miniBtn" onclick="editEntryRecord('repair','${r.id}')">Edit</button>`:""}${canEdit()&&r.status!=="completed"?`<button class="btn" onclick="completeRepair('${r.id}')">Complete Repair</button>`:""}</div></div></div>`
}
'''
          rep(old,new,'repair card')

          rep('...maintenance.filter(x=>x.asset_id===id).map(x=>({date:x.service_date,type:"Maintenance",title:x.notes||"Maintenance",cost:x.cost})),','...maintenance.filter(x=>x.asset_id===id).map(x=>({id:x.id,kind:"maintenance",date:x.service_date,type:"Maintenance",title:x.notes||"Maintenance",cost:x.cost})),','maintenance history mapping')
          rep('...repairs.filter(x=>x.asset_id===id).map(x=>({date:(x.opened_at||"").slice(0,10),type:"Repair",title:x.title,cost:x.cost})),','...repairs.filter(x=>x.asset_id===id).map(x=>({id:x.id,kind:"repair",date:(x.opened_at||"").slice(0,10),type:"Repair",title:x.title,cost:x.cost})),','repair history mapping')
          rep('...expenses.filter(x=>x.asset_id===id).map(x=>({date:x.expense_date,type:"Expense",title:x.description||x.category,cost:x.amount}))','...expenses.filter(x=>x.asset_id===id).map(x=>({id:x.id,kind:"expense",date:x.expense_date,type:"Expense",title:x.description||x.category,cost:x.amount}))','expense history mapping')

          old_active='''${activeRepair?`<div class="notice"><div class="kicker">ACTIVE REPAIR · ${repairStatusText(activeRepair.status)}</div><b>${esc(activeRepair.title)}</b><div class="tiny">${activeRepair.vendor?esc(activeRepair.vendor)+" · ":""}${money(activeRepair.cost)}</div>${canEdit()?`<br><button class="btn wide" onclick="completeRepair('${activeRepair.id}')">Complete Repair</button>`:""}</div>`:""}'''
          new_active='''${activeRepair?`<div class="notice"><div class="kicker">ACTIVE REPAIR · ${repairStatusText(activeRepair.status)}</div><b>${esc(activeRepair.title)}</b><div class="tiny">${activeRepair.vendor?esc(activeRepair.vendor)+" · ":""}${money(activeRepair.cost)}</div>${canEdit()?`<div class="row" style="margin-top:12px"><button class="miniBtn" onclick="editEntryRecord('repair','${activeRepair.id}')">Edit Repair</button><button class="btn" onclick="completeRepair('${activeRepair.id}')">Complete Repair</button></div>`:""}</div>`:""}'''
          rep(old_active,new_active,'active repair controls')

          old_hist='''<h2>History</h2>${hist.length?hist.map(x=>`<div class="card row"><div><b>${esc(x.title)}</b><div class="tiny">${x.date} · ${x.type}</div></div><b>${money(x.cost)}</b></div>`).join(""):'<div class="empty">No history yet.</div>'}'''
          new_hist='''<h2>History</h2>${hist.length?hist.map(x=>`<div class="card row"><div><b>${esc(x.title)}</b><div class="tiny">${x.date} · ${x.type}</div></div><div style="display:flex;align-items:center;gap:10px"><b>${money(x.cost)}</b>${canEdit()&&(x.kind==="maintenance"||x.kind==="repair")?`<button class="miniBtn" onclick="editEntryRecord('${x.kind}','${x.id}')">Edit</button>`:""}</div></div>`).join(""):'<div class="empty">No history yet.</div>'}'''
          rep(old_hist,new_hist,'history cards')

          path.write_text(s)
          PY

          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          assert 'Equipment Cost Book V4.9.8' in s
          assert 'function editEntryRecord(type,id)' in s
          assert 'Edit Maintenance' in s and 'Edit Repair' in s
          assert '/rest/v1/maintenance_records?id=eq.' in s
          assert '/rest/v1/repairs?id=eq.' in s
          scripts=re.findall(r'<script>([\s\S]*?)</script>',s)
          Path('/tmp/costrig.js').write_text(scripts[-1])
          PY
          node --check /tmp/costrig.js

      - name: Commit to PR branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Allow editing maintenance and repair history"
          git push origin HEAD:${{ github.head_ref }}
