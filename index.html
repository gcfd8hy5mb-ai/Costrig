<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F172A">
<title>Equipment Cost Book V4.9.8</title>
<style>html,body{margin:0;min-height:100%;background:#0F172A;color:#F4F7FC;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.boot{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.boot small{color:#B0BED0}</style>
</head>
<body>
<div class="boot"><div><b>Equipment Cost Book</b><br><small>Loading…</small></div></div>
<script>
(async()=>{
  const response=await fetch('./app-core-v4.9.7.html?v=4.9.8');
  if(!response.ok)throw new Error('Could not load Equipment Cost Book.');
  let html=await response.text();
  const patch='<script src="./edit-history-v4.9.8.js?v=4.9.8"><\\/script>';
  html=html.replace('</body>',patch+'</body>');
  document.open();
  document.write(html);
  document.close();
})().catch(error=>{
  document.body.innerHTML='<div class="boot"><div><b>Equipment Cost Book could not start.</b><br><small>'+String(error.message||error)+'</small></div></div>';
});
</script>
</body>
</html>
